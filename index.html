<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jira App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header img {
            height: 50px;
            vertical-align: middle;
        }
        main {
            padding: 40px;
            text-align: center;
        }
        footer {
            background-color: #f2f2f2;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        footer a {
            margin: 0 10px;
            color: #3498db;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Jira_%28Software%29_logo.svg" alt="Logo do Jira">
        <span style="font-size: 24px; margin-left: 10px;">Jira App</span>
    </header>

    <main>
        <h1>Bem-vindo ao Jira App!</h1>
        <p>Esta é a sua aplicação integrada com o Jira e o GitHub.</p>
        <p>Teste de Vinculação.</p>
    </main>

    <footer>
        <p>Links úteis:</p>
        <a href="https://www.atlassian.com/software/jira" target="_blank">Site oficial do Jira</a>
        <a href="https://github.com/juniorbr007" target="_blank">Meu GitHub</a>
        <a href="https://developer.atlassian.com" target="_blank">Documentação Jira</a>
    </footer>

</body>
</html>
